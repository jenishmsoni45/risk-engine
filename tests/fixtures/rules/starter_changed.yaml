# A changed starter rule set for tests/integration/test_rule_versions.py: a version no other rule
# file uses, a backup answer of allow, and large_transfer lowered from 1,000,000 to 500,000, so a
# transfer of 600,000 that version 1 allows is held here.
version: 3
default: allow
on_timeout: allow
rules:
  - id: velocity_1m
    action: hold
    all:
      - { feature: out_count_1m, op: ">=", value: 5 }
  - id: attempt_burst_1m
    action: block
    all:
      - { feature: attempt_count_1m, op: ">=", value: 10 }
  - id: daily_outflow_24h
    action: hold
    all:
      - { feature: out_sum_24h, op: ">=", value: 2500000 }
  - id: large_transfer
    action: hold
    all:
      - { feature: amount, op: ">=", value: 500000 }
  - id: dest_fan_in_1h
    action: hold
    all:
      - { feature: dest_in_count_1h, op: ">=", value: 20 }
  - id: pass_through_1h
    action: hold
    all:
      - { feature: in_sum_1h, op: ">=", value: 200000 }
      - { feature: amount, op: ">=", value: 200000 }
